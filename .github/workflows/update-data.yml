name: Update FPL data

# Runs every morning so the week's planning uses fresh prices, ownership and
# injury news, and every three hours once the next deadline is within 36 hours
# so predicted lineups and press-conference news land in time. Also on request
# (Actions tab or the site's Refresh button) and when the pipeline changes.
#
# Times are UTC, which is an hour behind Irish time from late March to late
# October. GitHub also queues scheduled runs and has been observed starting
# them anywhere from 20 minutes to over two hours late, and runs booked on the
# hour wait longest, so the morning run is booked early and off the hour to
# land before breakfast either side of the clock change.
on:
  schedule:
    - cron: "37 3 * * *"       # 03:37 UTC = 04:37 Irish summer, 03:37 winter
    - cron: "0 */3 * * *"      # every 3 hours; skipped unless near a deadline
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this run is needed
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "0 */3 * * *" ]; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime
          try:
              d = json.load(open("data/fpl.json"))["deadline"]
              hours = (datetime.datetime.fromisoformat(d.replace("Z", "+00:00")) - datetime.datetime.now(datetime.timezone.utc)).total_seconds() / 3600
              print("run=" + ("yes" if -1 < hours <= 36 else "no"))
              print(f"note=deadline in {hours:.1f} h")
          except Exception as e:
              print("run=yes"); print(f"note=no deadline known ({e})")
          PY
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
      - name: Fetch raw data
        if: steps.gate.outputs.run == 'yes'
        env:
          FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
        run: python pipeline/fetch.py
      - name: Build site bundle
        if: steps.gate.outputs.run == 'yes'
        run: python pipeline/build.py
      - name: Read team news
        # Only inside the news window (see --max-hours); searching costs money and
        # football news a week out is worthless. Every exit path is 0.
        if: steps.gate.outputs.run == 'yes' && github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "no key; skipping news"; exit 0; fi
          pip install --quiet anthropic || { echo "could not install the SDK; skipping"; exit 0; }
          python pipeline/news.py || echo "news step failed; carrying on"
          # Rebuild so any new signals are folded into the bundle the site reads.
          python pipeline/build.py
      - name: Write the weekly briefing
        # Optional: needs the ANTHROPIC_API_KEY secret. The guards are inside the
        # script rather than in an `if:` condition, because a step's own `env:`
        # block is not readable from its own `if:` - the earlier version silently
        # never ran. Every exit path here is 0: the briefing must not be able to
        # block a data refresh.
        #
        # Not on push: a development push should never spend money. The script
        # additionally skips if a briefing for this gameweek is under 10 h old,
        # so the three-hourly runs near a deadline write at most one a night.
        if: steps.gate.outputs.run == 'yes' && github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "no ANTHROPIC_API_KEY secret; skipping the briefing"
            exit 0
          fi
          pip install --quiet anthropic || { echo "could not install the SDK; skipping"; exit 0; }
          python pipeline/briefing.py || echo "briefing step failed; keeping the previous one"
      - name: Commit if changed
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "fpl-picker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data      # -A so a briefing that was never written cannot abort the commit
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
