name: Update FPL data

# Runs on request only: from the Actions tab, from the site's "Refresh data"
# button (workflow_dispatch through the API), or when the pipeline itself changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch raw data
        env:
          FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
        run: python pipeline/fetch.py
      - name: Build site bundle
        run: python pipeline/build.py
      - name: Commit if changed
        run: |
          git config user.name "fpl-picker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fpl.json data/history
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
