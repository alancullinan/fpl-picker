name: Update FPL data

# Runs every morning so the week's planning uses fresh prices, ownership and
# injury news, and every three hours once the next deadline is within 36 hours
# so predicted lineups and press-conference news land in time. Also on request
# (Actions tab or the site's Refresh button) and when the pipeline changes.
#
# Times are UTC, which is an hour behind Irish time from late March to late
# October. GitHub also queues scheduled runs and has been observed starting
# them anywhere from 20 minutes to over two hours late, and runs booked on the
# hour wait longest, so the morning run is booked early and off the hour to
# land before breakfast either side of the clock change.
on:
  schedule:
    - cron: "37 3 * * *"       # 03:37 UTC = 04:37 Irish summer, 03:37 winter
    - cron: "0 */3 * * *"      # every 3 hours; skipped unless near a deadline
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this run is needed
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "0 */3 * * *" ]; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime
          try:
              d = json.load(open("data/fpl.json"))["deadline"]
              hours = (datetime.datetime.fromisoformat(d.replace("Z", "+00:00")) - datetime.datetime.now(datetime.timezone.utc)).total_seconds() / 3600
              print("run=" + ("yes" if -1 < hours <= 36 else "no"))
              print(f"note=deadline in {hours:.1f} h")
          except Exception as e:
              print("run=yes"); print(f"note=no deadline known ({e})")
          PY
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
      - name: Fetch raw data
        if: steps.gate.outputs.run == 'yes'
        env:
          FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
        run: python pipeline/fetch.py
      - name: Build site bundle
        if: steps.gate.outputs.run == 'yes'
        run: python pipeline/build.py
      - name: Write the weekly briefing
        # Optional: needs the ANTHROPIC_API_KEY secret. Skipped without it, and
        # a failure inside the script leaves the previous briefing in place.
        if: steps.gate.outputs.run == 'yes' && env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet anthropic
          python pipeline/briefing.py
      - name: Commit if changed
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "fpl-picker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fpl.json data/history data/briefing.json
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
